databases:
  - name: creatorforge-db
    databaseName: creatorforge
    user: creatorforge
    plan: free

services:
  - type: web
    name: creatorforge-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: creatorforge-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://creatorforge-frontend.onrender.com"]'
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-5
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_MODEL
        value: eleven_multilingual_v2
    # Note: no persistent disk on the free plan — Cloud Storage/Audio Studio
    # uploads live on ephemeral local disk and are lost on redeploy/restart.
    # Upgrade this service's plan and add a `disk:` block to persist them.

  - type: web
    name: creatorforge-frontend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://creatorforge-backend.onrender.com
